#test change
name: Build and Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'sample-app/**'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      LOG_LEVEL: debug

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
      - name: Print environment
        run: |
          echo "Environment: ${{ env.NODE_ENV }}"
          echo "Log Level: ${{ env.LOG_LEVEL }}"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: ./sample-app
        run: npm install  # Changed from: npm ci

      - name: Run tests
        working-directory: ./sample-app
        run: npm test

  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - run: npm install  # Changed from: npm ci
        working-directory: ./sample-app

      - run: npm run lint
        working-directory: ./sample-app

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Print test results
        run: echo "Tests completed successfully!"
