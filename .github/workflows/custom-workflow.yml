name: Custom Develop Workflow

on:
  push:
    branches:
      - develop

env:
  MY_NAME: "Charith"

jobs:
  custom-job:
    runs-on: ubuntu-latest
    env:
      APP_ENV: "development"
    steps:
      - name: Print a greeting
        run: echo "Hello! This custom workflow is running on the develop branch."
      
      - name: Print Environment Variables
        run: |
          echo "User Name is: $MY_NAME"
          echo "Current Environment is: $APP_ENV"
          
      - name: Use GitHub Secret
        env:
          SECRET_PASS: ${{ secrets.MY_SUPER_SECRET }}
        run: echo "My secret password is $SECRET_PASS"