name: Task 6 - Secrets and Environment Variables

on:
  push:
    branches: [ main, working-advanced-kenath ]
  workflow_dispatch:

env:
  APP_ENV: production
  APP_NAME: github-actions-learning

jobs:
  use-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display environment variables
        run: |
          echo "App Name: $APP_NAME"
          echo "Environment: $APP_ENV"

      - name: Use a secret safely
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Secret is set: ${{ secrets.MY_SECRET != '' }}"
          echo "We never print secrets directly!"

      - name: Conditional step based on environment
        if: env.APP_ENV == 'production'
        run: echo "Running in PRODUCTION environment ✅"