name: Challenge 1 - Deploy to Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: kenath-github-actions-app
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json — simulating build step"
          fi

      - name: Build application
        run: |
          echo "🔨 Building application..."
          echo "Build complete ✅"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: .
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build

      - name: Deploy to Azure Web App (Simulated)
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "🚀 Deploying to Azure App Service..."
          echo "App Name: ${{ env.AZURE_WEBAPP_NAME }}"
          echo "Node Version: ${{ env.NODE_VERSION }}"
          echo "Azure credentials configured: ${{ secrets.AZURE_CREDENTIALS != '' }}"
          echo "✅ Deployment simulation complete!"

      - name: Post-deploy health check
        run: |
          echo "🏥 Running health check..."
          echo "Application is live! ✅"